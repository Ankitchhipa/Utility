// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = "2.2.20"

    repositories {
        // jcenter() // Removed
        maven {
            url 'https://maven.google.com/'
        }
        maven { url "https://jitpack.io" }
        mavenCentral()
        google()
    }
    dependencies {

        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.3'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.6'

        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.57.2'
    }
}

plugins{
    id 'com.google.devtools.ksp' version "2.2.20-2.0.3" apply false
    id 'org.jetbrains.kotlin.android' version '2.2.20' apply false
}

allprojects {
    def buildPath = (project.path == ':')
            ? 'root'
            : "modules/${project.path.substring(1).replace(':', '/')}"
    layout.buildDirectory.set(rootProject.layout.projectDirectory.dir(".gradle-build/${buildPath}"))
}

def deleteDirWithRetry = { File dir, int retries = 10, long delayMs = 500L ->
    if (dir == null || !dir.exists()) {
        return true
    }

    int attempt = 0
    while (dir.exists() && attempt < retries) {
        try {
            project.delete(dir)
        } catch (Exception ignored) {
            // Retry on Windows file locks.
        }
        if (!dir.exists()) {
            return true
        }
        attempt++
        sleep(delayMs)
    }

    return !dir.exists()
}

tasks.register("clean") {
    group = "build"
    description = "Deletes root and module build directories with retry logic for transient Windows file locks."

    doLast {
        def failedDeletes = []

        if (!deleteDirWithRetry(rootProject.layout.buildDirectory.get().asFile)) {
            failedDeletes << rootProject.layout.buildDirectory.get().asFile.absolutePath
        }
        subprojects.each { subproject ->
            if (!deleteDirWithRetry(subproject.layout.buildDirectory.get().asFile)) {
                failedDeletes << subproject.layout.buildDirectory.get().asFile.absolutePath
            }
        }

        if (!failedDeletes.isEmpty()) {
            logger.warn("Clean skipped locked directories:\n - " + failedDeletes.join("\n - "))
            logger.warn("Windows still has open handles on those paths. This will not block future builds because outputs are regenerated in place.")
        }
    }
}

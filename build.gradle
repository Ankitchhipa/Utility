// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = "2.2.20"

    repositories {
        maven { url 'https://maven.google.com/' }
        maven { url "https://jitpack.io" }
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.3'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.6'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.57.2'
    }
}

plugins {
    id 'com.google.devtools.ksp' version "2.2.20-2.0.3" apply false
    id 'org.jetbrains.kotlin.android' version '2.2.20' apply false
}

allprojects {
    // Reverting to standard build directories for maximum stability on Windows
}

/**
 * Enhanced clean task that handles Windows file locks by renaming locked directories.
 * This ensures that even if a file is in use, it won't block the build process.
 */
tasks.register("clean") {
    group = "build"
    doLast {
        def buildDirs = []
        // Add root build dir
        buildDirs << layout.buildDirectory.asFile.get()
        // Add subproject build dirs
        subprojects.each { buildDirs << it.layout.buildDirectory.asFile.get() }
        // Add the old problematic path just in case
        buildDirs << file(".gradle-build")

        buildDirs.each { dir ->
            if (dir.exists()) {
                println "Cleaning: ${dir.absolutePath}"
                if (!deleteWithWindowsWorkaround(dir)) {
                    println "Warning: Folder ${dir.name} is locked. It was renamed and will be skipped."
                }
            }
        }
    }
}

def deleteWithWindowsWorkaround(File dir) {
    if (!dir.exists()) return true
    try {
        // Try standard delete
        dir.deleteDir()
        if (!dir.exists()) return true
    } catch (Exception ignored) {}

    // If standard delete fails, rename the folder to "abandon" it
    def abandonName = "${dir.name}_TO_DELETE_${System.currentTimeMillis()}"
    def abandonDir = new File(dir.parentFile, abandonName)
    
    if (dir.renameTo(abandonDir)) {
        // Try to delete the renamed folder in background, but don't fail if it doesn't work
        abandonDir.deleteDir()
        return true
    }
    return false
}
